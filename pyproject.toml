[project]
name = "agentcore-standards"
version = "0.1.0"
description = "Standards library for agents on Amazon Bedrock AgentCore. Not a hosted platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-eval",
  "agentcore-tracing",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "primitives/tracing",
  "primitives/eval",
  "primitives/tools",
  "primitives/guardrails",
  "primitives/memory",
  "primitives/identity",
  "primitives/approvals",
  "primitives/context",
  "primitives/recovery",
  "primitives/completion",
  "primitives/langchain",
  "primitives/agent",
  "primitives/front-door",
  "patterns/_template/agent",
  "patterns/policy-qa/agent",
  "infra/constructs",
  "templates/minimal-agent",
  "templates/agent-with-tools",
]

[tool.uv.sources]
agentcore-eval = { workspace = true }
agentcore-tracing = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "strands-agents>=1.20,<2",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["primitives", "templates", "scripts", "tests"]
extend-exclude = [".venv", "evidence", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = [
  "primitives/tracing/src",
  "primitives/eval/src",
  "primitives/tools/src",
  "primitives/guardrails/src",
  "primitives/memory/src",
  "primitives/identity/src",
  "primitives/approvals/src",
  "primitives/context/src",
  "primitives/recovery/src",
  "primitives/completion/src",
  "primitives/langchain/src",
  "primitives/agent/src",
  "primitives/front-door/src",
  "patterns/_template/agent/template_agent",
  "patterns/policy-qa/agent/policy_qa",
  "infra/constructs/src",
  "primitives/gateway-tools/_template/template_tool",
  "templates/minimal-agent/src",
  "templates/agent-with-tools/src",
  "scripts/check_boundaries.py",
  "scripts/images.py",
  "scripts/local_token.py",
  "scripts/front_door_smoke.py",
  "docker/local/create_tables.py",
]
mypy_path = "patterns/_template/agent:patterns/policy-qa/agent:primitives/gateway-tools/_template:templates/minimal-agent/src:templates/agent-with-tools/src"

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "langchain.*",
  "langchain_aws",
  "langchain_core.*",
  "langgraph.*",
  "langgraph_checkpoint_aws",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "primitives/tracing/tests",
  "primitives/eval/tests",
  "primitives/tools/tests",
  "primitives/guardrails/tests",
  "primitives/memory/tests",
  "primitives/identity/tests",
  "primitives/approvals/tests",
  "primitives/context/tests",
  "primitives/recovery/tests",
  "primitives/completion/tests",
  "primitives/langchain/tests",
  "primitives/agent/tests",
  "primitives/front-door/tests",
  "patterns/_template/tests",
  "patterns/policy-qa/tests",
  "primitives/gateway-tools/_template/tests",
  "infra/constructs/tests",
  "templates/minimal-agent/tests",
  "templates/agent-with-tools/tests",
  "tests",
]
pythonpath = [
  "patterns/_template/agent",
  "patterns/policy-qa/agent",
  "primitives/gateway-tools/_template",
  "templates/minimal-agent/src",
  "templates/agent-with-tools/src",
  "primitives/tools/tests",
  "primitives/front-door/tests",
]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "runtime: calls Amazon Bedrock AgentCore Runtime; skipped unless AWS credentials and AGENTCORE_RUNTIME_ARN are set",
]

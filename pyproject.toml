[project]
name = "agentcore-standards"
version = "0.1.0"
description = "Standards library for agents on Amazon Bedrock AgentCore. Not a hosted platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-eval",
  "agentcore-tracing",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "packages/agentcore-tracing",
  "packages/agentcore-eval",
  "packages/agentcore-tools",
  "packages/agentcore-guardrails",
  "packages/agentcore-memory",
  "packages/agentcore-identity",
  "packages/agentcore-approvals",
  "packages/agentcore-context",
  "packages/agentcore-recovery",
  "packages/agentcore-completion",
  "packages/agentcore-langchain",
  "templates/minimal-agent",
  "templates/agent-with-tools",
]

[tool.uv.sources]
agentcore-eval = { workspace = true }
agentcore-tracing = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages", "templates", "scripts", "tests"]
extend-exclude = [".venv", "evidence", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = [
  "packages/agentcore-tracing/src",
  "packages/agentcore-eval/src",
  "packages/agentcore-tools/src",
  "packages/agentcore-guardrails/src",
  "packages/agentcore-memory/src",
  "packages/agentcore-identity/src",
  "packages/agentcore-approvals/src",
  "packages/agentcore-context/src",
  "packages/agentcore-recovery/src",
  "packages/agentcore-completion/src",
  "packages/agentcore-langchain/src",
  "templates/minimal-agent/src",
  "templates/agent-with-tools/src",
  "scripts/check_boundaries.py",
]
mypy_path = "templates/minimal-agent/src:templates/agent-with-tools/src"

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "langchain.*",
  "langchain_aws",
  "langchain_core.*",
  "langgraph.*",
  "langgraph_checkpoint_aws",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "packages/agentcore-tracing/tests",
  "packages/agentcore-eval/tests",
  "packages/agentcore-tools/tests",
  "packages/agentcore-guardrails/tests",
  "packages/agentcore-memory/tests",
  "packages/agentcore-identity/tests",
  "packages/agentcore-approvals/tests",
  "packages/agentcore-context/tests",
  "packages/agentcore-recovery/tests",
  "packages/agentcore-completion/tests",
  "packages/agentcore-langchain/tests",
  "templates/minimal-agent/tests",
  "templates/agent-with-tools/tests",
  "tests",
]
pythonpath = [
  "templates/minimal-agent/src",
  "templates/agent-with-tools/src",
  "packages/agentcore-tools/tests",
]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "runtime: calls Amazon Bedrock AgentCore Runtime; skipped unless AWS credentials and AGENTCORE_RUNTIME_ARN are set",
]

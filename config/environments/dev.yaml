# Development. Stateful resources are destroyed on teardown. Secrets are referenced by name;
# values live in Secrets Manager. Shape follows sample-agentcore-enterprise-platform presets/*.yaml.
environment: dev
deployment:
  mode: development
region: eu-west-2
endpoint: DEV
removal: destroy
log_retention_days: 30
secrets:
  prefix: agentcore/dev
  rotation_days: 90
controls:
  front_door: true
  guardrails_service: false
  audit_store: true
  kill_switch: true
  quotas: true
observability:
  alarms: false
  alarm_email: ""
network:
  mode: PUBLIC
# What the front door enforces across every agent in this environment
# (agentcore_front_door.policy.DoorSettings). Zero means no limit.
front_door:
  quotas:
    user_daily: 200
    team_daily: 2000
    agent_daily: 5000
    user_per_minute: 10
  user_monthly_usd: 20
  team_monthly_usd: 200
  lease_grace_s: 30
  throttle:
    rate: 10
    burst: 20
  # USD per million tokens. Check https://aws.amazon.com/bedrock/pricing/ for the region before relying on them.
  prices:
    "eu.anthropic.claude-sonnet-4-5-20250929-v1:0":
      input_per_million: 3.0
      output_per_million: 15.0
    "eu.anthropic.claude-haiku-4-5-20251001-v1:0":
      input_per_million: 1.0
      output_per_million: 5.0

[project]
name = "agentcore-front-door"
version = "0.1.0"
description = "The one entry point: verified caller, bound session, quotas, kill switches, caps, on-behalf-of tokens, model access, cost and audit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-identity",
  "agentcore-recovery",
  "boto3>=1.40",
  "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
agentcore-front-door = "agentcore_front_door.cli:main"

[tool.uv.sources]
agentcore-identity = { workspace = true }
agentcore-recovery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_front_door"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

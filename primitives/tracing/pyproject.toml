[project]
name = "agentcore-tracing"
version = "0.1.0"
description = "OpenTelemetry span conventions and cost attributes for AgentCore agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_tracing"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

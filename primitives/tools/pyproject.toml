[project]
name = "agentcore-tools"
version = "0.1.0"
description = "Tool registry, Gateway Lambda targets, deny-by-default policy, and idempotency wrappers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-tracing",
  "boto3>=1.35",
]

[tool.uv.sources]
agentcore-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_tools"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

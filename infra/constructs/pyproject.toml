[project]
name = "agentcore-constructs"
version = "0.1.0"
description = "CDK constructs every pattern deploys with: KMS, secrets with rotation, ECR with scanning, log groups with retention and PII masking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aws-cdk-lib>=2.200,<3",
  "constructs>=10.4,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_constructs"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

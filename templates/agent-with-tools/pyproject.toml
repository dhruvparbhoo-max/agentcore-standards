[project]
name = "agent-with-tools"
version = "0.1.0"
description = "Invoice desk: LangChain create_agent with Gateway tools on Amazon Bedrock AgentCore Runtime. An application, not a published library."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-approvals",
  "agentcore-context",
  "agentcore-eval",
  "agentcore-guardrails",
  "agentcore-identity",
  "agentcore-langchain",
  "agentcore-memory",
  "agentcore-recovery",
  "agentcore-tools",
  "agentcore-tracing",
  "bedrock-agentcore>=1.24",
  "langchain>=1.3.3",
]

[tool.uv]
package = false

[tool.uv.sources]
agentcore-approvals = { workspace = true }
agentcore-context = { workspace = true }
agentcore-eval = { workspace = true }
agentcore-guardrails = { workspace = true }
agentcore-identity = { workspace = true }
agentcore-langchain = { workspace = true }
agentcore-memory = { workspace = true }
agentcore-recovery = { workspace = true }
agentcore-tools = { workspace = true }
agentcore-tracing = { workspace = true }

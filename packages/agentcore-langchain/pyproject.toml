[project]
name = "agentcore-langchain"
version = "0.1.0"
description = "Bind a LangChain create_agent loop to an AgentCore tool registry and Runtime turn."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-context",
  "agentcore-identity",
  "agentcore-tools",
  "langchain>=1.0,<2",
]

[tool.uv.sources]
agentcore-context = { workspace = true }
agentcore-identity = { workspace = true }
agentcore-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_langchain"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "agentcore-eval"
version = "0.1.0"
description = "RuntimeHarness protocol, verdicts, and the eval suite runner for AgentCore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-tracing",
  "bedrock-agentcore>=1.24",
  "boto3>=1.35",
]

[tool.uv.sources]
agentcore-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_eval"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "agentcore-memory"
version = "0.1.0"
description = "Short-term events and long-term records. Writes go through the guardrail."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-guardrails",
]

[tool.uv.sources]
agentcore-guardrails = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_memory"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

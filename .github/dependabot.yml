# Dependabot configuration. Copied from aws-samples/sample-social-intelligence-agents
# .github/dependabot.yml (MIT-0) and adapted to this repo's folders.
#
#   * The uv ecosystem at "/" is the single source of truth for Python deps
#     (every workspace member's pyproject.toml plus the one uv.lock). CI fails when
#     the lock is stale (`uv lock --check`).
#   * Updates are grouped to keep PR volume low and CI-coherent: one PR per
#     ecosystem for minor+patch bumps, with majors surfaced individually so their
#     breaking-change review is not hidden inside a group.
#   * Base images are pinned by digest. The docker ecosystem proposes new digests
#     for each Dockerfile folder; the toolchain image in .devcontainer is included.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/docker/base-agent"
      - "/docker/base-lambda"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      base-images:
        patterns:
          - "*"

  # Keep CI's pinned GitHub Actions current (they are SHA-pinned in ci.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

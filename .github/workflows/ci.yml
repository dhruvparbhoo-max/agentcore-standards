name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -m "not runtime"
      - name: Path bans
        run: uv run python scripts/check_boundaries.py
      - name: Judge mock golden eval
        run: PYTHONPATH=templates/minimal-agent/src uv run python -m minimal_agent.judge --evidence-dir evidence/judge
      - name: Upload judge evidence
        uses: actions/upload-artifact@v4
        with:
          name: minimal-agent-judge-evidence
          path: evidence/judge
          if-no-files-found: error

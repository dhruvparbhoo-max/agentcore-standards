# Pull request checks. Every step runs inside the toolchain image built from
# .devcontainer/Dockerfile, the same container developers use. No AWS access:
# tests marked `runtime` are deselected, and nothing deploys.
#
# Lock gate (`uv lock --check`, `uv sync --locked`) and SHA-pinned actions follow
# aws-samples/sample-social-intelligence-agents .github/workflows/ci.yml (MIT-0).
# The arm64 build and the Trivy gate follow aws-samples/sample-bedrock-agentcore-runtime-cicd
# (MIT-0) and docs/design/library.md (Deployment).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TOOLCHAIN: agentcore-standards/toolchain:ci

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build toolchain image
        run: docker buildx build --load -t "$TOOLCHAIN" .devcontainer
      - name: Lint, types, tests, boundaries, kit checks
        run: docker run --rm --user root -v "$PWD":/workspace "$TOOLCHAIN" make ci
      - name: AgentCore CLI validate (generated project)
        run: docker run --rm --user root -v "$PWD":/workspace -w /workspace/patterns/_template "$TOOLCHAIN" agentcore validate
      - name: Judge mock golden eval
        run: >
          docker run --rm --user root -v "$PWD":/workspace -e PYTHONPATH=patterns/minimal-agent/src "$TOOLCHAIN"
          bash -c 'uv sync --all-packages --locked -q && python -m minimal_agent.judge --evidence-dir evidence/judge'
      - name: Upload judge evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-agent-judge-evidence
          path: evidence/judge
          if-no-files-found: error

  images:
    # Native arm64 runner: AgentCore Runtime and our Lambdas run linux/arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build toolchain image
        run: docker buildx build --load -t "$TOOLCHAIN" .devcontainer
      - name: Build every image for linux/arm64
        run: >
          docker run --rm --user root -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/workspace "$TOOLCHAIN"
          python3 scripts/images.py build --platform linux/arm64 --tag ci
      - name: Trivy (fail on fixable HIGH or CRITICAL)
        run: >
          docker run --rm --user root -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/workspace "$TOOLCHAIN"
          python3 scripts/images.py scan --tag ci

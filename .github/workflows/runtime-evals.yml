name: runtime-evals

on:
  push:
  pull_request:

jobs:
  agentcore-runtime:
    name: Runtime judge gate (SKIPPED is not PASS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen
      - name: Golden eval on AgentCore Runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AGENTCORE_RUNTIME_ARN: ${{ secrets.AGENTCORE_RUNTIME_ARN }}
          AGENTCORE_RUNTIME_QUALIFIER: ${{ secrets.AGENTCORE_RUNTIME_QUALIFIER }}
          AGENTCORE_SPAN_LOG_GROUP: ${{ secrets.AGENTCORE_SPAN_LOG_GROUP }}
          AGENTCORE_APP_LOG_GROUP: ${{ secrets.AGENTCORE_APP_LOG_GROUP }}
        run: |
          PYTHONPATH=templates/minimal-agent/src uv run python -m minimal_agent.judge \
            --harness runtime \
            --evidence-dir evidence/judge
      - name: Upload Runtime judge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-judge-evidence
          path: evidence/judge
          if-no-files-found: error

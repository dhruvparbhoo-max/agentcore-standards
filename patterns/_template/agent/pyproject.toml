[project]
name = "pattern-template-agent"
version = "0.1.0"
description = "The template pattern's agent. Copy patterns/_template to start a pattern. An application, not a published library."
requires-python = ">=3.12"
dependencies = [
  "agentcore-agent[strands]",
  "bedrock-agentcore>=1.24",
  "langchain-aws>=1.0",
]

[tool.uv.sources]
agentcore-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template_agent"]

[project]
name = "minimal-agent"
version = "0.1.0"
description = "Thinnest AgentCore Runtime entrypoint. An application, not a published library."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-eval",
  "agentcore-tracing",
  "bedrock-agentcore>=1.24",
]

[tool.uv]
package = false

[tool.uv.sources]
agentcore-eval = { workspace = true }
agentcore-tracing = { workspace = true }

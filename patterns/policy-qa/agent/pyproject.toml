[project]
name = "pattern-policy-qa-agent"
version = "0.1.0"
description = "Company-policy questions. Retrieves through a trusted wrapper, cites the source, or says it could not find the policy. An application, not a published library."
requires-python = ">=3.12"
dependencies = [
  "agentcore-agent[strands]",
  "agentcore-tools",
  "bedrock-agentcore>=1.24",
  "langchain-aws>=1.0",
]

[tool.uv.sources]
agentcore-agent = { workspace = true }
agentcore-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_qa"]
